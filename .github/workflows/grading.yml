name: Automated Grading - ASP.NET Core Product API

on:
  push:
    branches:
      - '*-assignment'  # student1-assignment, student2-assignment
  pull_request:
    branches:
      - '*-assignment'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write  # Only for PR comments

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: |
        cd src/Assignment2
        dotnet restore Assignment2.sln
    
    - name: Check Clean Architecture (NetArchTest) - 15/21
      id: archtest
      run: |
        cd src/Assignment2
        dotnet add Assignment2.Tests/Assignment2.Tests.csproj package NetArchTest.Rules --version 1.3.0 || true
        dotnet build Assignment2.sln
        if dotnet test Assignment2.sln --no-build --filter "ArchitectureTests" --logger "console;verbosity=detailed" 2>/dev/null | grep -q "Passed!"; then
          echo "arch_score=15" >> $GITHUB_OUTPUT
          echo "### Clean Architecture: ✅ 15/21" >> $GITHUB_STEP_SUMMARY
        else
          echo "arch_score=8" >> $GITHUB_OUTPUT
          echo "### Clean Architecture: ❌ 8/21" >> $GITHUB_STEP_SUMMARY
        fi
    
    - name: Check Packages & Files (Part 1-3) - 25/52
      id: packages
      run: |
        cd src/Assignment2
        SCORE=0
        
        # Redis/MongoDB (8 marks)
        if dotnet list Assignment2.sln package | grep -q "StackExchange.Redis\|MongoDB"; then
          SCORE=$((SCORE+8)); echo "✅ Redis/MongoDB: 8/8" >> $GITHUB_STEP_SUMMARY
        fi
        
        # MediatR & Folder structure (5 marks)
        if dotnet list Assignment2.sln package | grep -q MediatR && [ -d "../Application" ] && [ -d "../Infrastructure" ]; then
          SCORE=$((SCORE+5)); echo "✅ MediatR/Clean Arch: 5/5" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "packages_score=$SCORE" >> $GITHUB_OUTPUT
        echo "### Packages Check: $SCORE/52" >> $GITHUB_STEP_SUMMARY
    
    - name: Build & Run Tests - 15/15
      run: |
        cd src/Assignment2
        dotnet build Assignment2.sln --no-restore -c Release
        dotnet test Assignment2.sln --no-build --logger "trx" --results-directory "./test-results" || echo "Tests optional"
        echo "✅ Build Success: 15/15" >> $GITHUB_STEP_SUMMARY
    
    - name: Check API Features - 15/26
      run: |
        # Check DTOs, appsettings.env, Postman collection
        if [ -d "src/Application/DTOs" ] && ls appsettings.*.json | grep -q . && [ -f "postman/*.json" ]; then
          echo "✅ DTOs/Config/Postman: 15/26" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ Missing files: 8/26" >> $GITHUB_STEP_SUMMARY
        fi
    
    - name: Generate Score Report
      run: |
        TOTAL=$((15 + ${{ steps.packages.outputs.packages_score }} + 15 + 15))
        echo "## FINAL SCORE: $TOTAL/76 (Manual: 24 marks)" >> $GITHUB_STEP_SUMMARY
        echo "![Grading](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/badge?event=grading)" >> $GITHUB_STEP_SUMMARY
        echo "total_score=$TOTAL" >> $GITHUB_ENV

    - name: Upload Report
      uses: actions/upload-artifact@v4
      with:
        name: grading-report-${{ github.sha }}
        path: test-results/

    - name: Final Student Report
      run: |
        ARCH_SCORE=${{ steps.archtest.outputs.arch_score || 0 }}
        PKG_SCORE=${{ steps.packages.outputs.packages_score || 0 }}
        TOTAL=$((ARCH_SCORE + PKG_SCORE + 30))
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 🎯 STUDENT SCORE: $TOTAL/76" >> $GITHUB_STEP_SUMMARY
        echo "## 📊 Breakdown" >> $GITHUB_STEP_SUMMARY
        echo "- Clean Architecture: ${ARCH_SCORE}/21" >> $GITHUB_STEP_SUMMARY
        echo "- Packages/Features: ${PKG_SCORE}/52" >> $GITHUB_STEP_SUMMARY
        echo "- Build/Tests: 30/30" >> $GITHUB_STEP_SUMMARY
        echo "- 🔧 **Manual Review: 24 marks** (IIS/Postman)" >> $GITHUB_STEP_SUMMARY
        
        # Create badge image link
        echo "![](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/badge?for=grade&branch=${{ github.ref }})" >> $GITHUB_STEP_SUMMARY
        
        # Comment on PR if exists
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "✅ **Score: $TOTAL/76** - View details above!" >> $GITHUB_STEP_SUMMARY
        fi